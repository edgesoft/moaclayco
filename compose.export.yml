name: moaclayco-accounting-export

services:
  sgwoods-export:
    build:
      context: ./tools/sgwoods-export
    env_file:
      - ${APP_ENV_FILE:-.env.stage.local}
    environment:
      SGWOODS_LOGO_PATH: /assets/sgwoods.svg
    volumes:
      - ./exports:/exports
      - ./public/sgwoods.svg:/assets/sgwoods.svg:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
