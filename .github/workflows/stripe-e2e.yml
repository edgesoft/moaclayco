name: Stripe Webhook E2E

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stripe-webhook-e2e
  cancel-in-progress: false

jobs:
  verify:
    name: Verify real Stripe sandbox webhooks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Require Stripe sandbox key
        env:
          STRIPE_SRV: ${{ secrets.STRIPE_E2E_SECRET_KEY }}
        run: test -n "$STRIPE_SRV"

      - name: Run isolated Stripe webhook E2E
        env:
          STRIPE_SRV: ${{ secrets.STRIPE_E2E_SECRET_KEY }}
        run: npm run test:e2e:stripe
