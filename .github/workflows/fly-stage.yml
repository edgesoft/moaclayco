name: Fly Stage

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - next
      - "next-**"

permissions:
  contents: read

concurrency:
  group: fly-stage-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app Stage
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the commit approved by CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1

      - name: Deploy stage
        run: flyctl deploy -a moaclayco-stage --remote-only --config fly-stage.toml --dockerfile Dockerfile-stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test stage
        run: node tools/smoke-check.mjs --url=https://moaclayco-stage.fly.dev --timeout=30000

      - name: Set up Node.js for mobile browser tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Test Android and iPhone storefront flows
        run: npm run test:e2e:mobile
        env:
          MOBILE_E2E_BASE_URL: https://moaclayco-stage.fly.dev
