name: CI

on:
  pull_request:
    branches:
      - master
      - next
  push:
    branches:
      - next
      - "next-**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Type-check application
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Enforce critical security baseline
        run: npm run audit:critical
